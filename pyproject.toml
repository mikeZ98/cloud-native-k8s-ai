[project]
name = "cloud-native-k8s-ai"
version = "0.1.0"
description = "Production Kubernetes & IaC infrastructure for AI microservices: FastAPI, Qdrant StatefulSet, Redis, KEDA autoscaling, NetworkPolicies and Terraform bootstrap, with hermetic static manifest validation."
readme = "README.md"
license = "MIT"
authors = [{ name = "mikeZ98", email = "145975972+mikeZ98@users.noreply.github.com" }]
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "prometheus-client>=0.21",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-socket>=0.7",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit[toml]>=1.8",
  "yamllint>=1.35",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4.23",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_native_k8s_ai"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "PT", "RET",
  "ARG", "PTH", "PL", "RUF", "ASYNC", "TRY", "PERF", "FBT", "T20", "BLE", "ERA",
]
ignore = ["PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "FBT"]

[tool.ruff.lint.isort]
known-first-party = ["cloud_native_k8s_ai"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = ".cache/mypy"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# yamllint and pytest-socket ship no type information.
module = ["yamllint.*", "pytest_socket.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest / coverage (hermetic: no network, no cluster, no cloud APIs)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--disable-socket",
  "--allow-unix-socket",  # asyncio self-pipe only; AF_INET/AF_INET6 stay blocked
  "--cov=cloud_native_k8s_ai",
  "--cov-branch",
  "--cov-report=term-missing",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["cloud_native_k8s_ai"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".cache"]
