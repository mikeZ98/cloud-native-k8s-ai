{{- $q := .Values.qdrant }}
{{- $ctx := dict "root" $ "name" $q.name "component" "vector-store" "extra" $q.labels }}
---
# Headless Service: stable per-pod DNS names for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-headless" $q.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ai.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: rest
      port: {{ int $q.ports.rest }}
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: {{ int $q.ports.grpc }}
      targetPort: grpc
      protocol: TCP
---
# Client Service used by the API (QDRANT_HOST).
apiVersion: v1
kind: Service
metadata:
  name: {{ $q.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: rest
      port: {{ int $q.ports.rest }}
      targetPort: rest
      protocol: TCP
    - name: grpc
      port: {{ int $q.ports.grpc }}
      targetPort: grpc
      protocol: TCP
