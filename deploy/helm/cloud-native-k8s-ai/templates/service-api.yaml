{{- $api := .Values.api }}
{{- $ctx := dict "root" $ "name" $api.name "component" "api" "extra" $api.labels }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ int $api.service.port }}
      targetPort: http
      protocol: TCP
