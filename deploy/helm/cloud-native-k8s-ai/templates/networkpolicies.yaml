{{- /*
Zero trust: deny every flow in the namespace, then open exactly the flows that
core.AIStackGenerator.intent() declares. Change both together; the offline topology solver
rejects any reachable flow the intent does not declare.
*/}}
{{- $ns := .Release.Namespace }}
{{- $np := .Values.networkPolicy }}
{{- $api := dict "name" .Values.api.name "component" "api" }}
{{- $qdrant := dict "name" .Values.qdrant.name "component" "vector-store" }}
{{- $redis := dict "name" .Values.redis.name "component" "broker" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# Every pod may resolve names through kube-dns, and nothing else by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Qdrant accepts traffic from the API pods only, on REST and gRPC.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-allow-from-app
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai.selectorLabels" $qdrant | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ai.selectorLabels" $api | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.qdrant.ports.rest }}
        - protocol: TCP
          port: {{ int .Values.qdrant.ports.grpc }}
  egress: []
---
# The API is reachable only from the ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-ingress" .Values.api.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai.selectorLabels" $api | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
      ports:
        - protocol: TCP
          port: {{ int .Values.api.containerPort }}
  egress: []
---
# The API may call Qdrant (REST, gRPC) and Redis, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-egress" .Values.api.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai.selectorLabels" $api | nindent 6 }}
  policyTypes:
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ai.selectorLabels" $qdrant | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.qdrant.ports.rest }}
        - protocol: TCP
          port: {{ int .Values.qdrant.ports.grpc }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ai.selectorLabels" $redis | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.redis.port }}
---
# Redis accepts the API (jobs) and the KEDA operator (queue-length polling).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-allow-ingress" .Values.redis.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "ai.releaseLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai.selectorLabels" $redis | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ai.selectorLabels" $api | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.kedaOperator.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.kedaOperator.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int .Values.redis.port }}
  egress: []
